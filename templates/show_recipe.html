<!DOCTYPE html>
<html>

<head>
  <title>{{recipe.name}}</title>
</head>

<body>


  <h1>{{recipe.name}}</h1>
  {% if session.user_id == recipe.user_id %}
  <p>
    <a href="/edit_recipe/{{recipe.id}}">Muokkaa</a>
    <a href="/remove_recipe/{{recipe.id}}">Poista</a>
  </p>
  {% endif %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}, id-numerosi on {{session.user_id}}
  </p>
  <p>
    {{recipe.cooking_time}} min
  </p>
  <p>
    {{recipe.ingredients}}
  </p>
  <p>
    {{recipe.instructions}}
  </p>
  <p>
    Nimimerkki: {{recipe.username}}
  </p>
  <p>
    <a href="/">Takaisin</a>
  </p>
</body>

</html>
