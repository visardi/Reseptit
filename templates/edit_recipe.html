<!DOCTYPE html>
<html>

<head>
  <title>Reseptin muokkaus</title>
</head>

<body>
  <h1>Ilmoituksen muokkaus</h1>
  <form action="/update_recipe" method="post">
    <p>
      Reseptin nimi: <br />
      <input type="text" name="name" value="{{recipe.name}}" />
    </p>
    <p>
      Valmistusaika: <br />
      <input type="text" name="cooking_time" size="2" value="{{recipe.cooking_time}}" /> min
    </p>
    <p>
      Ainesosat: <br />
      <textarea name="ingredients" rows="8" cols="60">{{recipe.ingredients}}</textarea>
    </p>

    <p>
      Valmistusohjeet: <br />
      <textarea name="instructions" rows="8" cols="60">{{recipe.instructions}}</textarea>
    </p>
    <input type="hidden" name="recipe_id" value="{{recipe.id}}" />
    <input type="submit" value="Päivitä ilmoitus" />
  </form>
</body>

</html>
